<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Leaves Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <!-- Body Gradient -->
    <linearGradient id="fruitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <!-- Pattern Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="32" cy="32" r="30" fill="#FFF9E6" />

  <g filter="url(#shadow)">
    <!-- Leaves Crown -->
    <!-- Back leaf left -->
    <path d="M 23 24 C 18 16 12 12 10 10 C 16 15 22 21 26 23 Z" fill="#689F38"/>
    <!-- Back leaf right -->
    <path d="M 41 24 C 46 16 52 12 54 10 C 48 15 42 21 38 23 Z" fill="#689F38"/>
    <!-- Middle left leaf -->
    <path d="M 27 22 C 22 13 17 6 15 3 C 22 9 27 16 30 21 Z" fill="url(#leafGrad)"/>
    <!-- Middle right leaf -->
    <path d="M 37 22 C 42 13 47 6 49 3 C 42 9 37 16 34 21 Z" fill="url(#leafGrad)"/>
    <!-- Center top leaf -->
    <path d="M 32 20 C 32 10 32 2 32 2 C 32 2 32 10 32 20 Z" fill="#9CCC65"/>
    <path d="M 32 20 C 29 12 28 4 28 2 C 32 8 33 15 32 20 Z" fill="url(#leafGrad)"/>

    <!-- Pineapple Body -->
    <rect x="18" y="21" width="28" height="36" rx="14" ry="18" fill="url(#fruitGrad)"/>

    <!-- Texture Crosshatch Lines (Cross Diamonds) -->
    <g stroke="#E65100" stroke-width="1.2" stroke-linecap="round" opacity="0.4">
      <!-- Diagonals \ -->
      <line x1="22" y1="26" x2="42" y2="46"/>
      <line x1="19" y1="33" x2="39" y2="53"/>
      <line x1="27" y1="23" x2="45" y2="41"/>

      <!-- Diagonals / -->
      <line x1="42" y1="26" x2="22" y2="46"/>
      <line x1="45" y1="33" x2="25" y2="53"/>
      <line x1="37" y1="23" x2="19" y2="41"/>
    </g>

    <!-- Diamond Dots -->
    <g fill="#FFF59D" opacity="0.8">
      <circle cx="32" cy="27" r="1.2"/>
      <circle cx="26" cy="33" r="1.2"/>
      <circle cx="38" cy="33" r="1.2"/>
      <circle cx="32" cy="39" r="1.2"/>
      <circle cx="26" cy="45" r="1.2"/>
      <circle cx="38" cy="45" r="1.2"/>
      <circle cx="32" cy="51" r="1.2"/>
    </g>
  </g>
</svg>
